name: bot-observador

on:
  schedule:
    - cron: "*/15 13-22 * * 1-5"   # UTC; cobre horário de verão e inverno
  workflow_dispatch:
    inputs:
      force:
        description: "Forçar execução/relatório fora do horário"
        default: ""

permissions:
  contents: write

concurrency:
  group: bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Executar bot
        env:
          FORCE: ${{ github.event.inputs.force }}
        run: python main.py

      - name: Salvar estado e relatórios
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data reports || true
          git diff --staged --quiet || (git commit -m "bot: $(date -u +%FT%TZ)" && git pull --rebase && git push)
